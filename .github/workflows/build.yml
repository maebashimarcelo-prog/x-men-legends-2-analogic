
name: Build diagnostic DINPUT DLL

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'include/**'
      - 'build.ps1'
      - 'scripts/Inspect-Proxy.ps1'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Zig 0.15.2
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      
      - name: Compile and inspect 32-bit DINPUT.dll
        shell: pwsh
        env:
          ZIG_GLOBAL_CACHE_DIR: ${{ runner.temp }}/zig-global-cache
          ZIG_LOCAL_CACHE_DIR: ${{ github.workspace }}/zig-local-cache
        run: ./build.ps1

      - name: Upload diagnostic DLL
        uses: actions/upload-artifact@v4
        with:
          name: XML2-Diagnostic-DINPUT-x86
          path: build/DINPUT.dll
          if-no-files-found: error
